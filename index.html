<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1b1b1e" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="메모장" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>메모장</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="stylesheet" href="app.css" />
  <script type="module" src="app.js"></script>
</head>
<body>
  <!-- 아이콘 모음 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/></symbol>
    <symbol id="i-new" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M12 12v6M9 15h6"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M12 4v11m0 0-4-4m4 4 4-4"/><path d="M5 19h14"/></symbol>
    <symbol id="i-saveas" viewBox="0 0 24 24"><path d="M10 4v9m0 0-3.5-3.5M10 13l3.5-3.5"/><path d="M3 17h11"/><path d="M17 14l4 4-4 4"/><path d="M14 18h7" transform="translate(0 0)"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
    <symbol id="i-redo" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></symbol>
    <symbol id="i-replace" viewBox="0 0 24 24"><path d="M4 8h14l-3-3M20 16H6l3 3"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="M12 19V5m0 0-6 6m6-6 6 6"/></symbol>
    <symbol id="i-arrow-down" viewBox="0 0 24 24"><path d="M12 5v14m0 0-6-6m6 6 6-6"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r=".8"/><circle cx="4.5" cy="12" r=".8"/><circle cx="4.5" cy="18" r=".8"/></symbol>
    <symbol id="i-wrap" viewBox="0 0 24 24"><path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12"/><path d="M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></symbol>
    <symbol id="i-doc" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h6"/></symbol>
  </svg>

  <div class="app" id="app">
    <!-- 첫 화면 -->
    <section id="home" class="view">
      <div class="home-col">
        <div>
          <h1 class="home-title">메모장</h1>
          <p class="home-sub">txt 파일을 열어 읽고, 고치고, 저장합니다.</p>
        </div>
        <div class="home-actions">
          <button class="big primary" id="home-new" type="button">
            <svg><use href="#i-new"/></svg>새로 만들기<small>⌘N · Ctrl+N</small>
          </button>
          <button class="big" id="home-open" type="button">
            <svg><use href="#i-folder"/></svg>파일 열기<small>⌘O · Ctrl+O</small>
          </button>
        </div>
        <h2 class="section-title">최근 문서</h2>
        <p class="section-note">열거나 저장한 문서의 사본을 이 앱 안에 보관합니다(최근 30개).</p>
        <ul class="recent" id="recent"></ul>
        <div class="tip" id="install-tip" hidden>
          <b>앱처럼 쓰기</b> — Safari 의 공유 버튼 → <b>홈 화면에 추가</b>를 누르면 아이콘이 생기고 전체 화면으로 열립니다. 인터넷이 없어도 열립니다.
        </div>
      </div>
    </section>

    <!-- 편집기 -->
    <section id="editor" class="view" hidden>
      <header class="header">
        <div class="left">
          <button class="btn" id="btn-exit" type="button"><svg><use href="#i-back"/></svg>나가기</button>
        </div>
        <div class="title">
          <span class="name" id="doc-name">제목 없음.txt</span>
          <span class="sub" id="doc-sub">읽기 모드</span>
        </div>
        <div class="right">
          <button class="btn" id="btn-find-top" type="button"><svg><use href="#i-search"/></svg>찾기</button>
          <button class="btn primary" id="btn-mode" type="button"><svg><use href="#i-pencil"/></svg><span>편집</span></button>
        </div>
      </header>

      <nav class="toolbar" id="toolbar" hidden>
        <button class="btn" id="tb-new" type="button"><svg><use href="#i-new"/></svg>새로 만들기</button>
        <button class="btn" id="tb-open" type="button"><svg><use href="#i-folder"/></svg>열기</button>
        <button class="btn" id="tb-save" type="button"><svg><use href="#i-save"/></svg>저장</button>
        <button class="btn" id="tb-saveas" type="button"><svg><use href="#i-saveas"/></svg>다른 이름으로 저장</button>
        <span class="vsep"></span>
        <button class="btn" id="tb-undo" type="button"><svg><use href="#i-undo"/></svg>실행 취소</button>
        <button class="btn" id="tb-redo" type="button"><svg><use href="#i-redo"/></svg>다시 실행</button>
        <span class="vsep"></span>
        <button class="btn" id="tb-find" type="button"><svg><use href="#i-search"/></svg>찾기</button>
        <button class="btn" id="tb-replace" type="button"><svg><use href="#i-replace"/></svg>바꾸기</button>
      </nav>

      <div class="findbar" id="findbar" hidden>
        <div class="row">
          <input class="field search" id="find-input" type="text" placeholder="찾을 내용" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" />
          <span class="count" id="find-count"></span>
          <button class="btn icon" id="find-prev" type="button" title="이전 찾기 (⇧⌘G, Shift+Enter)" aria-label="이전 찾기"><svg><use href="#i-up"/></svg></button>
          <button class="btn icon" id="find-next" type="button" title="다음 찾기 (⌘G, Enter)" aria-label="다음 찾기"><svg><use href="#i-down"/></svg></button>
          <button class="btn" id="find-all" type="button"><svg><use href="#i-list"/></svg>모두 찾기</button>
          <span class="vsep"></span>
          <button class="btn toggle" id="opt-case" type="button" title="대/소문자 구분" aria-pressed="false">Aa</button>
          <button class="btn icon toggle on" id="opt-wrap" type="button" title="처음부터 다시 찾기" aria-pressed="true"><svg><use href="#i-wrap"/></svg></button>
          <span class="vsep"></span>
          <label class="check" id="replace-toggle-wrap"><input type="checkbox" id="replace-toggle" />바꾸기</label>
          <button class="btn icon" id="find-close" type="button" title="닫기 (Esc)" aria-label="찾기 닫기"><svg><use href="#i-x"/></svg></button>
        </div>
        <div class="row" id="replace-row" hidden>
          <input class="field replace" id="replace-input" type="text" placeholder="바꿀 내용" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" />
          <button class="btn" id="rep-up" type="button"><svg><use href="#i-arrow-up"/></svg>위로 바꾸기</button>
          <button class="btn" id="rep-down" type="button"><svg><use href="#i-arrow-down"/></svg>아래로 바꾸기</button>
          <button class="btn primary" id="rep-all" type="button"><svg><use href="#i-replace"/></svg>모두 바꾸기</button>
        </div>
      </div>

      <main class="doc" id="doc">
        <div class="backdrop" id="backdrop" aria-hidden="true"></div>
        <textarea id="text" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" aria-label="본문"></textarea>
        <div class="reader" id="reader" hidden></div>
        <div class="para-bar" id="para-bar" hidden>
          <button class="btn primary" id="para-copy" type="button"><svg><use href="#i-copy"/></svg>단락 복사</button>
          <button class="btn icon" id="para-close" type="button" aria-label="선택 해제"><svg><use href="#i-x"/></svg></button>
        </div>
      </main>

      <footer class="statusbar">
        <span id="st-pos">줄 1, 열 1</span>
        <span class="vsep"></span>
        <span id="st-count">0자 · 1줄</span>
        <span class="grow"></span>
        <span class="zoom">
          <button id="zoom-out" type="button" aria-label="글자 작게">−</button>
          <button id="zoom-reset" type="button" title="기본 크기">100%</button>
          <button id="zoom-in" type="button" aria-label="글자 크게">+</button>
        </span>
        <span class="vsep"></span>
        <select id="st-eol" aria-label="저장할 줄 구분"></select>
        <span class="vsep"></span>
        <select id="st-enc" aria-label="저장할 문자셋"></select>
      </footer>
      <div class="safe-bottom"></div>
    </section>
  </div>

  <input type="file" id="file-input" accept=".txt,.text,.md,.log,.csv,.tsv,.json,.ini,.srt,text/plain" hidden />
</body>
</html>
